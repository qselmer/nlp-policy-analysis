project:
  name: Global climate-fisheries evidence map
  focal_fishery: North-central Peruvian anchoveta (Engraulis ringens)
  primary_question: >-
    What scientific, technical, operational, project-based, policy, and legal evidence
    explains climate and environmental risks to marine fisheries, identifies adaptation
    and management responses, and provides transferable lessons for Peruvian anchoveta?

screening:
  include_when:
    - The source concerns marine fisheries, fishery governance, forage fish, small pelagics, or a directly relevant marine ecosystem.
    - The source contains a climate, environmental-variability, extreme-event, precautionary, ecosystem, adaptation, or resilience component.
    - The source contributes at least one codable finding, mechanism, method, projection, evaluation, recommendation, or implementation lesson.
  exclude_when:
    - The source contains only a generic climate or ocean mention without fisheries relevance.
    - The source concerns only aquaculture, inland fisheries, or terrestrial policy and provides no explicit transferable mechanism.
    - The source is a duplicate, superseded version without historical value, abstract-only record, or lacks enough text to verify claims.
    - No specific finding, provision, result, or project component can be located.
  priority_groups:
    - small_pelagics
    - pelagics
    - short_lived_species
    - forage_fish
    - eastern_boundary_upwelling_systems
    - climate_sensitive_fisheries
    - adaptive_fisheries_management

