transferability_components:
  ecological_similarity:
    0: unrelated
    1: marine_fishery
    2: pelagic_or_short_lived
    3: small_pelagic_or_anchovy
  climate_relevance:
    0: absent
    1: general
    2: explicit_driver_or_response
    3: climate_information_linked_to_management_or_outcomes
  management_relevance:
    0: absent
    1: indirect
    2: direct_management_or_governance_application
  evidence_strength:
    0: weak_or_unverifiable
    1: moderate
    2: strong_and_traceable
  operational_specificity:
    0: conceptual_only
    1: partially_specified
    2: implemented_or_predefined
  data_feasibility_peru:
    0: unavailable
    1: partially_available
    2: routinely_available

validation:
  require_source_locator: true
  require_supporting_evidence: true
  prohibit_inference_from_missing_text: true
  distinguish_source_type_and_authority: true
  human_review_all_included_sources: true
  human_review_all_binding_claims: true
  human_review_all_quantitative_results_used_in_synthesis: true
  human_review_all_high_transferability_cases: true
  validate_exclusions_with_stratified_random_sample: true
