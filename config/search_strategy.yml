search_channels:
  scientific_databases:
    - name: Scopus
      query_family: bibliographic
      export_format: csv_or_ris
    - name: Web of Science
      query_family: bibliographic
      export_format: csv_or_ris
    - name: OpenAlex
      query_family: bibliographic_api
      export_format: json_or_csv
    - name: Crossref
      query_family: bibliographic_api
      export_format: json_or_csv
    - name: Google Scholar
      query_family: supplementary_snowballing
      export_format: manual

  institutional_sources:
    - FAO
    - IPCC
    - UNFCCC
    - CBD
    - UNEP
    - World Bank
    - Inter-American Development Bank
    - OECD
    - ICES
    - NOAA Fisheries
    - Fisheries and Oceans Canada
    - Australian Fisheries Management Authority
    - European Commission and EUR-Lex
    - GFCM
    - SPRFMO
    - NEAFC
    - NAFO
    - CCAMLR
    - IATTC
    - IMARPE
    - PRODUCE Peru
    - MINAM Peru
    - SUBPESCA Chile
    - IFOP Chile

query_design:
  broad_query_blocks:
    - climate
    - fisheries
  priority_query_blocks:
    - climate
    - fisheries
    - taxa
  operator_within_block: OR
  operator_between_blocks: AND
  preserve_exact_query: true
  record_result_count: true
  record_search_date: true
  record_platform_and_filters: true

validation:
  pilot_target_per_source_family: 5
  dual_screening_pilot: true
  prioritise_recall: true
  benchmark_set_required: true
  peer_review_search_strategy: true
