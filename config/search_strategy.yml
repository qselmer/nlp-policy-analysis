project:
  review_title: Global climate–fisheries evidence map
  focal_application: North-central Peruvian anchoveta
  review_type: systematic_evidence_map

scope:
  environments:
    - marine
    - coastal
  sectors:
    - capture_fisheries
    - fishery_management
    - marine_governance
  priority_taxa:
    - small_pelagics
    - forage_fish
    - pelagics
    - short_lived_fish
  priority_species:
    - anchovy
    - sardine
    - herring
    - capelin
    - mackerel
    - horse_mackerel
    - menhaden
  focal_species:
    scientific_name: Engraulis ringens
    common_names:
      en: [Peruvian anchoveta, anchoveta, anchovy]
      es: [anchoveta peruana, anchoveta]
      pt: [anchoveta peruana, anchova]
      fr: [anchois du Pérou, anchois]

eligibility:
  date_from: 1990
  date_to: null
  languages:
    - English
    - Spanish
    - Portuguese
    - French
  include_source_families:
    - scientific_literature
    - technical_and_grey_literature
    - projects_and_programmes
    - policy_and_management
    - legal_and_regulatory
  exclude:
    - freshwater_only
    - aquaculture_only
    - terrestrial_only
    - climate_mitigation_without_fisheries_link
    - source_without_retrievable_full_text_or_sufficient_metadata

