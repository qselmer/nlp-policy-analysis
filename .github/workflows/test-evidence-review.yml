name: Test evidence review

on:
  pull_request:
    paths:
      - "src/evidence_review/**"
      - "src/regulatory_review/**"
      - "tests/**"
      - "config/*.yml"
      - "requirements-regulatory.txt"
      - ".github/workflows/test-evidence-review.yml"
  push:
    branches:
      - agent/regulatory-review-scaffold
    paths:
      - "src/evidence_review/**"
      - "src/regulatory_review/**"
      - "tests/**"
      - "config/*.yml"
      - "requirements-regulatory.txt"
      - ".github/workflows/test-evidence-review.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-regulatory.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2" "pydantic>=2.7" "pytest>=8.2" "pyyaml>=6.0" "requests>=2.32"

      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q
